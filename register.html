<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Criar Conta - Sistema</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>

    <div class="d-flex flex-column align-items-center w-100 py-4">
        <div class="register-card">
            <div class="login-header">
                <div class="brand-mark"><i class="bi bi-person-plus-fill"></i></div>
                <h1>Criar sua conta</h1>
                <p>Preencha seus dados para começar</p>
            </div>

            <div class="login-body">
                <div id="alertMessage" class="alert d-none mb-3" role="alert"></div>

                <form id="mainForm" class="row g-3" novalidate>

                    <div class="col-md-6">
                        <label for="firstName" class="form-label">Nome</label>
                        <div class="input-wrap">
                            <i class="bi bi-person"></i>
                            <input type="text" id="firstName" class="form-control" placeholder="Nome" required>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label for="lastName" class="form-label">Sobrenome</label>
                        <div class="input-wrap">
                            <i class="bi bi-person"></i>
                            <input type="text" id="lastName" class="form-control" placeholder="Sobrenome" required>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label for="userName" class="form-label">Username</label>
                        <div class="input-wrap">
                            <i class="bi bi-at"></i>
                            <input type="text" id="userName" class="form-control" placeholder="seu.usuario" required>
                            <div id="validationServerUsernameFeedback" class="invalid-feedback"></div>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label for="email" class="form-label">E-mail</label>
                        <div class="input-wrap">
                            <i class="bi bi-envelope"></i>
                            <input type="email" id="email" class="form-control" placeholder="voce@email.com" required>
                            <div id="validationServerEmailFeedback" class="invalid-feedback"></div>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label for="password" class="form-label">Senha</label>
                        <div class="input-wrap">
                            <i class="bi bi-lock"></i>
                            <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                            <div id="validationServerPasswordFeedback" class="invalid-feedback"></div>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label for="confirmPassword" class="form-label">Confirmar Senha</label>
                        <div class="input-wrap">
                            <i class="bi bi-lock-fill"></i>
                            <input type="password" id="confirmPassword" class="form-control" placeholder="••••••••" required>
                            <div id="validationServerConfirmPasswordFeedback" class="invalid-feedback"></div>
                        </div>
                    </div>

                    <div class="col-12"><hr class="section-divider"><span class="section-label">Endereço</span></div>

                    <div class="col-md-4">
                        <label for="zip" class="form-label">CEP</label>
                        <div class="input-wrap">
                            <i class="bi bi-geo-alt"></i>
                            <input type="text" id="zip" class="form-control" placeholder="00000000" required>
                            <div id="validationServerZipFeedback" class="invalid-feedback"></div>
                        </div>
                    </div>

                    <div class="col-md-8">
                        <label for="country" class="form-label">País</label>
                        <div class="input-wrap">
                            <i class="bi bi-globe"></i>
                            <input type="text" id="country" class="form-control is-valid" value="Brazil" required>
                            <div id="validationServerCountryFeedback" class="invalid-feedback"></div>
                        </div>
                    </div>

                    <div class="col-md-4">
                        <label for="state" class="form-label">Estado</label>
                        <div class="input-wrap">
                            <i class="bi bi-map"></i>
                            <select class="form-control form-select" id="state" required>
                                <option selected disabled value="">Escolha...</option>
                                <option value="SP">São Paulo</option>
                                <option value="RJ">Rio de Janeiro</option>
                            </select>
                            <div id="validationServerStateFeedback" class="invalid-feedback"></div>
                        </div>
                    </div>

                    <div class="col-md-8">
                        <label for="city" class="form-label">Cidade</label>
                        <div class="input-wrap">
                            <i class="bi bi-building"></i>
                            <input type="text" id="city" class="form-control" placeholder="Cidade" required>
                            <div id="validationServerCityFeedback" class="invalid-feedback"></div>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label for="district" class="form-label">Bairro</label>
                        <div class="input-wrap">
                            <i class="bi bi-signpost"></i>
                            <input type="text" id="district" class="form-control" placeholder="Bairro" required>
                            <div id="validationServerDistrictFeedback" class="invalid-feedback"></div>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label for="street" class="form-label">Rua</label>
                        <div class="input-wrap">
                            <i class="bi bi-house"></i>
                            <input type="text" id="street" class="form-control" placeholder="Rua" required>
                            <div id="validationServerStreetFeedback" class="invalid-feedback"></div>
                        </div>
                    </div>

                    <div class="col-md-4">
                        <label for="number" class="form-label">Número</label>
                        <div class="input-wrap">
                            <i class="bi bi-123"></i>
                            <input type="text" id="number" class="form-control" placeholder="Nº" required>
                            <div id="validationServerNumberFeedback" class="invalid-feedback"></div>
                        </div>
                    </div>

                    <div class="col-md-8">
                        <label for="complement" class="form-label">Complemento</label>
                        <div class="input-wrap">
                            <i class="bi bi-pencil"></i>
                            <input type="text" id="complement" class="form-control" placeholder="Complemento" required>
                            <div id="validationServerComplementFeedback" class="invalid-feedback"></div>
                        </div>
                    </div>

                    <div class="col-12 mt-2">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" value="" id="invalidCheck" required>
                            <label class="form-check-label" for="invalidCheck">
                                Aceito os termos e condições
                            </label>
                            <div id="invalidCheckFeedback" class="invalid-feedback"></div>
                        </div>
                    </div>

                    <div class="col-12 mt-3">
                        <button type="submit" id="btnSubmit" class="btn-login" disabled>Criar Conta</button>
                    </div>

                    <div class="col-12 d-none">
                        <button type="button" id="btnTema"></button>
                    </div>
                </form>
            </div>

            <div class="login-footer">
                Já tenho uma conta? <a href="index.html">Fazer login</a>
            </div>
        </div>

        <div class="copyright">© 2024 | Desenvolvido por Seu Nome</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/app.js"></script>
</body>
</html>
