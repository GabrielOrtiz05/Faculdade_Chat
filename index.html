<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>UniLink - Conectando Universitarios</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>

    <div class="d-flex flex-column align-items-center w-100">
        <div class="login-card">
            <div class="login-header">
                <div class="brand-mark"><i class="bi bi-shield-lock-fill"></i></div>
                <h1>Bem-vindo de volta</h1>
                <p>Faça login para acessar sua conta</p>
            </div>

            <div class="login-body">
                <form id="loginForm" novalidate>
                    <label for="loginUserName" class="form-label">Username ou Email</label>
                    <div class="input-wrap">
                        <i class="bi bi-person"></i>
                        <input type="text" id="loginUserName" class="form-control" placeholder="seu.usuario" required>
                    </div>

                    <label for="loginPassword" class="form-label">Senha</label>
                    <div class="input-wrap">
                        <i class="bi bi-lock"></i>
                        <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required>
                    </div>

                    <div class="row-options">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="rememberMe">
                            <label class="form-check-label" for="rememberMe">Lembrar-me</label>
                        </div>
                        <a href="#">Esqueci minha senha</a>
                    </div>

                    <button type="submit" id="btnEntrar" class="btn-login">Entrar</button>

                    <div id="loginAlert" class="alert d-none mt-3" role="alert"></div>
                </form>
            </div>

            <div class="login-footer">
                Ainda não tem uma conta? <a href="register.html">Criar conta</a>
            </div>
        </div>

        <div class="copyright">© 2024 | Desenvolvido por Gabriel Ortiz</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/login.js"></script>
</body>
</html>
