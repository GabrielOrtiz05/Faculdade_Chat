<!doctype html>
<html lang="pt-br">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>UniLink Chat</title>

    <!-- GOOGLE FONT -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- BOOTSTRAP -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- ICONS -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <!-- CSS -->

    <link
        href="/css/chat.css"
        rel="stylesheet"
    >

</head>

<body>

    <main class="chat-container">

        <!-- SIDEBAR -->

        <aside class="sidebar">

            <div class="sidebar-top">

                <div>

                    <h4>UniLink</h4>

                    <small>
                        Conversas
                    </small>

                </div>

            </div>

            <!-- SEARCH -->

            <div class="search-box">

                <div class="input-group">

                    <span class="input-group-text">

                        <i class="bi bi-search"></i>

                    </span>

                    <input
                        type="text"
                        id="inputPesquisaUsuario"
                        class="form-control"
                        placeholder="
                            Pesquisar usuários...
                        "
                    >

                </div>

            </div>

            <!-- LIST -->

            <div
                class="chat-list"
                id="listaConversas"
            ></div>

        </aside>

        <!-- CHAT -->

        <section class="chat-content">

            <!-- HEADER -->

            <div class="chat-header">

                <div class="chat-user-data">

                    <div
                        class="avatar"
                        id="avatarChat"
                    >
                        U
                    </div>

                    <div>

                        <h5 id="nomeChatAtivo">

                            Selecione uma conversa

                        </h5>

                        <small>

                            Online

                        </small>

                    </div>

                </div>

            </div>

            <!-- MESSAGES -->

            <div
                class="chat-messages"
                id="mensagensArea"
            >

                <div class="empty-chat">

                    Selecione um chat
                    para começar

                </div>

            </div>

            <!-- INPUT -->

            <div class="chat-input">

                <form id="formMensagem">

                    <!-- EMOJI -->

                    <button
                        type="button"
                        class="media-btn"
                        id="btnEmoji"
                    >
                        😀
                    </button>

                    <!-- FILE -->

                    <label
                        class="media-btn"
                        for="inputArquivo"
                    >

                        <i class="bi bi-paperclip"></i>

                    </label>

                    <input
                        type="file"
                        id="inputArquivo"
                        hidden
                        accept="
                            image/*,
                            video/*,
                            audio/*,
                            .pdf,
                            .doc,
                            .docx,
                            .zip
                        "
                    >

                    <!-- INPUT -->

                    <input
                        type="text"
                        id="inputMensagem"
                        placeholder="
                            Digite uma mensagem...
                        "
                        autocomplete="off"
                    >

                    <!-- SEND -->

                    <button
                        type="submit"
                        id="btnEnviarMensagem"
                    >

                        <i class="bi bi-send-fill"></i>

                    </button>

                </form>

                <!-- EMOJIS -->

                <div
                    id="emojiPicker"
                    class="
                        emoji-picker
                        d-none
                    "
                ></div>

            </div>

        </section>

    </main>

    <!-- SUPABASE -->

    <script src="
        https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2
    "></script>

    <!-- JS -->

    <script src="/js/chat.js"></script>

</body>

</html>
